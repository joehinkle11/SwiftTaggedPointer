name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install swiftly
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Install Swift 6.4.0
        run: |
          swiftly install --assume-yes 6.4.0
          swiftly use 6.4.0
          swift --version
      - name: Install Wasm SDKs
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
          swift sdk list
      - name: Run checks on all platforms
        run: ./Scripts/check-all.sh
